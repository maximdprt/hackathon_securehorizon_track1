[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secure-agent-starter"
version = "0.1.0"
description = "Clone, run, your agent is protected: a reference payment agent with the Sentinel guard in its only money path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sentinel contributors" }]
keywords = ["ai-agents", "payments", "x402", "prompt-injection", "mcp", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "sentinel-guard",
    "mcp>=2.3,<3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
secure-agent = "secure_agent_starter.cli:main"

# Inside the monorepo the guard comes from the sibling folder; a standalone clone resolves it from PyPI.
[tool.uv.sources]
sentinel-guard = { path = "../sentinel-guard", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agent_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
